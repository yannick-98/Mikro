# Despliegue de Mikro en Netlify: la web como sitio estatico y el API de
# Express como funcion serverless, bajo el mismo dominio.

[build]
  command = "npm run build:netlify"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Evita que Netlify reinstale con --production y se deje las de desarrollo.
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  # El trazador por defecto sigue mejor los binarios nativos de Prisma que esbuild.
  node_bundler = "nft"
  external_node_modules = ["@prisma/client", ".prisma"]
  # Los datos viven en Postgres: a la funcion solo le hace falta el cliente de
  # Prisma con su motor nativo y el esquema.
  # El motor de Windows no pinta nada en una funcion que corre en Linux, y
  # ocupa 18 MB. Los .tmp son restos de un "prisma generate" interrumpido: en
  # Windows, si el fichero esta en uso, el renombrado final falla y la copia a
  # medias se queda ahi. Trece de esos restos llegaron a sumar 239 MB y
  # tumbaron el despliegue por superar el limite de 250 MB de la funcion.
  #
  # El limite tampoco es el problema de fondo: lo es que un comodin arrastre
  # lo que encuentre. Aqui se dice que no entra.
  included_files = [
    "backend/prisma/schema.prisma",
    "node_modules/.prisma/client/**",
    "!node_modules/.prisma/client/*windows*",
    "!node_modules/.prisma/client/*.tmp*",
    "node_modules/@prisma/client/**"
  ]

# El frontend llama a /api/...; aqui se redirige a la funcion.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# La app incrustada tiene su propia entrada HTML, con App Bridge en el head.
# Va antes del comodin para que no se la coma el index.html de la web.
[[redirects]]
  from = "/shopify"
  to = "/shopify.html"
  status = 200

# Y sus subrutas: la app incrustada tiene mas de una pantalla.
[[redirects]]
  from = "/shopify/*"
  to = "/shopify.html"
  status = 200

# Cualquier otra ruta la resuelve React Router en el cliente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# La app incrustada tiene que poder cargarse dentro del admin de Shopify, y
# solo ahi: frame-ancestors lo permite a Shopify y se lo niega a todos los demas.
[[headers]]
  for = "/shopify"
  [headers.values]
    Content-Security-Policy = "frame-ancestors https://admin.shopify.com https://*.myshopify.com;"

[[headers]]
  for = "/shopify/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors https://admin.shopify.com https://*.myshopify.com;"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
